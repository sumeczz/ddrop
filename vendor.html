<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vendor & Admin — My Dead Drops</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            brand: { DEFAULT: '#00b87c', light: '#00e699', dark: '#008f60' },
            bg: { light: '#f4f6f8', dark: '#0a0f14', cardLight: '#ffffff', cardDark: '#121921' }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-bg-light dark:bg-bg-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between antialiased">

  <header class="px-5 py-4 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md bg-white/70 dark:bg-bg-dark/70 border-b border-slate-200/60 dark:border-slate-800/60">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-brand/10 dark:bg-brand/20 flex items-center justify-center text-brand dark:text-brand-light">
        <i data-lucide="shield-check" class="w-5 h-5"></i>
      </div>
      <span class="font-extrabold text-lg text-slate-900 dark:text-white">Vendor Workspace</span>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="toggleTheme()" class="p-2.5 rounded-full hover:bg-slate-200/60 dark:hover:bg-slate-800/60">
        <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
        <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
      </button>
      <a href="index.html" class="p-2.5 rounded-full hover:bg-slate-200/60 dark:hover:bg-slate-800/60 text-slate-500">
        <i data-lucide="log-out" class="w-5 h-5"></i>
      </a>
    </div>
  </header>

  <main class="flex-1 px-4 py-6 max-w-md mx-auto w-full space-y-6">

    <!-- NAV TABS -->
    <div class="flex bg-slate-200/60 dark:bg-slate-800/60 p-1 rounded-2xl">
      <button id="tab-create-btn" onclick="switchTab('create')" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-brand text-white shadow-sm transition">
        Vytvořit Drop
      </button>
      <button id="tab-requests-btn" onclick="window.location.href='requests-vendor.html'" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
        Požadavky
      </button>
      <button id="tab-admin-btn" onclick="switchTab('admin')" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
        Admin & Logy
      </button>
    </div>

    <!-- TAB 1: VYTVOŘENÍ DROPŮ -->
    <div id="tab-create" class="space-y-4">
      <div id="pair-banner" class="hidden p-3 bg-brand/10 border border-brand/30 text-brand rounded-2xl text-xs font-bold flex justify-between items-center">
        <span>🔗 Párování s požadavkem: <strong id="pair-req-id">---</strong></span>
        <button onclick="cancelPairing()" class="underline text-[10px]">Zrušit</button>
      </div>

      <div class="rounded-3xl overflow-hidden border border-slate-200 dark:border-slate-800 h-52 relative shadow-sm">
        <div id="vendor-map" class="w-full h-full"></div>
        <button type="button" onclick="locateGPS()" class="absolute bottom-3 right-3 z-[1000] bg-white dark:bg-bg-cardDark border border-slate-200 dark:border-slate-800 p-2.5 rounded-xl shadow-lg text-brand font-bold text-xs flex items-center gap-1">
          <i data-lucide="crosshair" class="w-4 h-4"></i> GPS
        </button>
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Popis úschovy (E2EE)</label>
        <textarea id="desc-input" maxlength="500" placeholder="Návod k nalezení..." class="w-full bg-white dark:bg-bg-cardDark border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 text-sm font-medium focus:outline-none focus:border-brand h-24 resize-none text-slate-900 dark:text-white"></textarea>
      </div>

      <div>
        <label class="text-xs font-bold text-slate-700 dark:text-slate-300 mb-1 block">Fotografie</label>
        <label class="flex items-center justify-center gap-2 w-full p-4 bg-white dark:bg-bg-cardDark border border-dashed border-slate-300 dark:border-slate-700 rounded-2xl cursor-pointer text-xs font-bold text-slate-600 dark:text-slate-300">
          <i data-lucide="camera" class="w-4 h-4 text-brand"></i>
          <span id="file-label">Vybrat fotky</span>
          <input type="file" id="photo-input" multiple accept="image/*" onchange="handlePhotos(this)" class="hidden">
        </label>
        <div id="photo-previews" class="flex gap-2 mt-2"></div>
      </div>

      <div class="flex items-center gap-2 bg-white dark:bg-bg-cardDark p-4 rounded-2xl border border-slate-200 dark:border-slate-800">
        <input type="checkbox" id="burn-input" class="accent-brand w-4 h-4">
        <label for="burn-input" class="text-xs font-bold text-slate-700 dark:text-slate-300 cursor-pointer">
          🔥 Zničit po 1. zobrazení (Burn-after-read)
        </label>
      </div>

      <button id="vendor-submit-btn" onclick="createDrop()" class="w-full py-4 bg-brand hover:bg-brand-dark text-white font-extrabold rounded-2xl shadow-lg shadow-brand/25 flex items-center justify-center gap-2 text-base active:scale-[0.98] transition">
        <i data-lucide="lock" class="w-5 h-5"></i> Zašifrovat a Vygenerovat PIN
      </button>

      <!-- VENDOR SUCCESS BOX -->
      <div id="success-box" class="hidden p-6 bg-white dark:bg-bg-cardDark border border-slate-200 dark:border-slate-800 rounded-3xl text-center space-y-3">
        <i data-lucide="check-circle-2" class="w-12 h-12 text-brand mx-auto"></i>
        <h3 class="font-extrabold text-lg text-slate-900 dark:text-white">Dead Drop vytvořen!</h3>
        <div id="result-pin" class="text-3xl font-mono font-black text-brand tracking-widest bg-slate-50 dark:bg-slate-900 py-3 rounded-2xl border border-brand/30">
          ------
        </div>
        <button onclick="navigator.clipboard.writeText(document.getElementById('result-pin').innerText); alert('PIN zkopírován!');" class="w-full py-3 bg-brand text-white font-bold rounded-xl text-xs">
          Zkopírovat PIN
        </button>
      </div>
    </div>

    <!-- TAB 2: ADMIN & AUDIT LOGS -->
    <div id="tab-admin" class="hidden space-y-4">
      <div class="bg-white dark:bg-bg-cardDark p-5 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-extrabold text-sm text-slate-900 dark:text-white flex items-center gap-1.5">
            <i data-lucide="key" class="w-4 h-4 text-brand"></i> Změna Master PINu
          </h3>
        </div>
        <div class="flex gap-2">
          <input type="text" id="new-master-pin" placeholder="Nový Master PIN" class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-2.5 text-xs font-mono font-bold">
          <button onclick="changeMasterPin()" class="px-4 bg-brand text-white font-bold rounded-xl text-xs">Uložit</button>
        </div>
      </div>

      <div class="bg-white dark:bg-bg-cardDark p-5 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-3">
        <h3 class="font-extrabold text-sm text-slate-900 dark:text-white flex items-center gap-1.5">
          <i data-lucide="database" class="w-4 h-4 text-brand"></i> Uložené Drops v paměti
        </h3>
        <div id="admin-drops-list" class="space-y-2 text-xs"></div>
      </div>

      <div class="bg-white dark:bg-bg-cardDark p-5 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-extrabold text-sm text-slate-900 dark:text-white flex items-center gap-1.5">
            <i data-lucide="list" class="w-4 h-4 text-brand"></i> Auditní Logy Systému
          </h3>
          <button onclick="renderLogs()" class="text-[10px] text-brand font-bold">Obnovit</button>
        </div>
        <div id="logs-list" class="space-y-1.5 max-h-60 overflow-y-auto text-[11px] font-mono"></div>
      </div>
    </div>

  </main>

  <script>
    lucide.createIcons();

    let vendorMap = null, selectedMarker = null;
    let currentPos = { lat: 50.0755, lng: 14.4378 };
    let photoFiles = [];

    function initTheme() {
      const savedTheme = localStorage.getItem('mdd_theme') || 'dark';
      if (savedTheme === 'dark') document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('mdd_theme', isDark ? 'dark' : 'light');
    }

    function logEvent(action, details = '') {
      const logs = JSON.parse(localStorage.getItem('mdd_logs') || '[]');
      logs.unshift({ time: new Date().toISOString(), action, details });
      localStorage.setItem('mdd_logs', JSON.stringify(logs.slice(0, 100)));
    }

    function switchTab(tab) {
      document.getElementById('tab-create-btn').className = tab === 'create' ? "flex-1 py-2.5 text-xs font-bold rounded-xl bg-brand text-white shadow-sm transition" : "flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-500 dark:text-slate-400 transition";
      document.getElementById('tab-admin-btn').className = tab === 'admin' ? "flex-1 py-2.5 text-xs font-bold rounded-xl bg-brand text-white shadow-sm transition" : "flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-500 dark:text-slate-400 transition";
      
      document.getElementById('tab-create').classList.toggle('hidden', tab !== 'create');
      document.getElementById('tab-admin').classList.toggle('hidden', tab !== 'admin');

      if (tab === 'create') initVendorMap();
      if (tab === 'admin') { renderAdminDrops(); renderLogs(); }
    }

    function checkPairing() {
      const pairReqId = sessionStorage.getItem('pair_req_id');
      if (pairReqId) {
        document.getElementById('pair-banner').classList.remove('hidden');
        document.getElementById('pair-req-id').innerText = pairReqId;
      }
    }

    function cancelPairing() {
      sessionStorage.removeItem('pair_req_id');
      document.getElementById('pair-banner').classList.add('hidden');
    }

    function initVendorMap() {
      if (vendorMap) return;
      setTimeout(() => {
        vendorMap = L.map('vendor-map', { zoomControl: false }).setView([currentPos.lat, currentPos.lng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(vendorMap);
        selectedMarker = L.marker([currentPos.lat, currentPos.lng], { draggable: true }).addTo(vendorMap);
        selectedMarker.on('dragend', e => { currentPos = e.target.getLatLng(); });
      }, 100);
    }

    function locateGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          if (vendorMap) {
            vendorMap.setView([currentPos.lat, currentPos.lng], 17);
            selectedMarker.setLatLng([currentPos.lat, currentPos.lng]);
          }
        });
      }
    }

    function handlePhotos(input) {
      photoFiles = Array.from(input.files).slice(0, 3);
      document.getElementById('file-label').innerText = `Vybráno ${photoFiles.length} fotek`;
    }

    function generatePin() {
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let pin = '';
      for (let i = 0; i < 6; i++) pin += chars.charAt(Math.floor(Math.random() * chars.length));
      return pin;
    }

    async function hashPin(pin) {
      const msgUint8 = new TextEncoder().encode(pin.toUpperCase());
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function bufferToBase64(b) {
      let bin = ''; const bytes = new Uint8Array(b);
      for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
      return window.btoa(bin);
    }

    async function deriveKey(pin, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin.toUpperCase()), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 30000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }

    async function encryptData(dataObj, pin) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(pin, salt);
      const encBuffer = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(dataObj)));
      return { cipherText: bufferToBase64(encBuffer), salt: bufferToBase64(salt.buffer), iv: bufferToBase64(iv.buffer) };
    }

    async function createDrop() {
      const pin = generatePin();
      const pinH = await hashPin(pin);

      const encryptedPackage = await encryptData({
        desc: document.getElementById('desc-input').value,
        photos: []
      }, pin);

      const pairReqId = sessionStorage.getItem('pair_req_id');

      const dropRecord = {
        pin: pin,
        lat: currentPos.lat,
        lng: currentPos.lng,
        encrypted: encryptedPackage,
        burn: document.getElementById('burn-input').checked,
        created: Date.now(),
        linkedReqId: pairReqId || null,
        status: 'active'
      };

      localStorage.setItem(`drop_${pinH}`, JSON.stringify(dropRecord));

      if (pairReqId) {
        const requests = JSON.parse(localStorage.getItem('my_requests') || '[]');
        const req = requests.find(r => r.reqId === pairReqId);
        if (req) {
          req.status = 'completed';
          req.assignedPin = pin;
          localStorage.setItem('my_requests', JSON.stringify(requests));
        }
        cancelPairing();
      }

      logEvent('DROP_CREATED', `PIN: ${pin}, LinkedReq: ${pairReqId || 'none'}`);

      document.getElementById('result-pin').innerText = pin;
      document.getElementById('success-box').classList.remove('hidden');
    }

    function renderAdminDrops() {
      const list = document.getElementById('admin-drops-list');
      list.innerHTML = '';
      let count = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('drop_')) {
          count++;
          const data = JSON.parse(localStorage.getItem(key));
          const item = document.createElement('div');
          item.className = 'p-3 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 flex justify-between items-center';
          item.innerHTML = `
            <div>
              <span class="font-mono font-bold text-brand">PIN: ${data.pin}</span>
              <span class="text-[10px] text-slate-400 block">${data.status || 'Aktivní'}</span>
            </div>
            <button onclick="localStorage.removeItem('${key}'); renderAdminDrops();" class="text-red-500 font-bold text-xs">Smazat</button>
          `;
          list.appendChild(item);
        }
      }
      if (count === 0) list.innerHTML = '<p class="text-slate-400 text-center py-2">Žádné uložené drops.</p>';
    }

    function renderLogs() {
      const list = document.getElementById('logs-list');
      list.innerHTML = '';
      const logs = JSON.parse(localStorage.getItem('mdd_logs') || '[]');
      logs.forEach(l => {
        const item = document.createElement('div');
        item.className = 'p-2 bg-slate-50 dark:bg-slate-900 rounded border border-slate-200 dark:border-slate-800';
        item.innerHTML = `<span class="text-slate-400">${new Date(l.time).toLocaleTimeString()}</span> <strong class="text-brand">${l.action}</strong> ${l.details}`;
        list.appendChild(item);
      });
    }

    function changeMasterPin() {
      const pin = document.getElementById('new-master-pin').value.trim();
      if (pin.length >= 4) {
        localStorage.setItem('mdd_master_pin', pin);
        alert('Master PIN změněn!');
        logEvent('MASTER_PIN_CHANGED');
      }
    }

    initTheme();
    checkPairing();
    initVendorMap();
  </script>
</body>
</html>
