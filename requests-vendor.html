<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vendor — Správa Požadavků</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0a0a0a; color: #f5f5f5; user-select: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 font-sans antialiased">

  <header class="flex items-center justify-between border-b border-neutral-800 pb-3">
    <a href="index.html" class="flex items-center gap-2 text-emerald-400 font-bold tracking-wider">
      <i data-lucide="shield-lock" class="w-6 h-6"></i>
      <span>MY DEAD DROPS</span>
    </a>
    <a href="index.html" class="text-xs bg-neutral-800 text-neutral-300 px-3 py-1.5 rounded-lg flex items-center gap-1">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Zpět
    </a>
  </header>

  <main class="my-auto w-full max-w-md mx-auto py-6 space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-base font-bold text-neutral-100 flex items-center gap-2">
        <i data-lucide="inbox" class="w-5 h-5 text-emerald-400"></i> Příchozí požadavky
      </h2>
      <button onclick="renderRequests()" class="text-xs text-emerald-400 flex items-center gap-1">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Obnovit
      </button>
    </div>

    <div id="requests-container" class="space-y-3"></div>
  </main>

  <footer class="text-center text-[10px] text-neutral-600 pt-4">
    Vendor Panel • Správa Poptávek
  </footer>

  <script>
    lucide.createIcons();

    function renderRequests() {
      const container = document.getElementById('requests-container');
      container.innerHTML = '';
      
      const requests = JSON.parse(localStorage.getItem('my_requests') || '[]');

      if (requests.length === 0) {
        container.innerHTML = '<div class="p-8 text-center text-xs text-neutral-500 bg-neutral-900/50 rounded-2xl border border-neutral-800">Žádné příchozí požadavky.</div>';
        return;
      }

      requests.forEach((req, idx) => {
        const card = document.createElement('div');
        card.className = "bg-neutral-900 border border-neutral-800 rounded-2xl p-4 space-y-3 text-xs";
        
        card.innerHTML = `
          <div class="flex justify-between items-start border-b border-neutral-800 pb-2">
            <div>
              <span class="font-mono font-bold text-emerald-400">${req.reqId}</span>
              <p class="text-[10px] text-neutral-500">${new Date(req.date).toLocaleString('cs-CZ')}</p>
            </div>
            <span class="text-sm font-extrabold text-emerald-400 font-mono">${req.amount} Kč</span>
          </div>

          <div class="space-y-1">
            <p class="text-[10px] text-neutral-500 uppercase tracking-wider font-semibold">PaysafeCard Kupon</p>
            <p class="font-mono text-neutral-200 bg-neutral-950 p-2 rounded border border-neutral-800 select-all">
              ${req.pscCode ? req.pscCode : '<span class="text-neutral-600 italic">Nepřiložen (Platba při předání)</span>'}
            </p>
          </div>

          ${req.note ? `
            <div>
              <p class="text-[10px] text-neutral-500 uppercase tracking-wider font-semibold">Poznámka / Oblast</p>
              <p class="text-neutral-300 bg-neutral-950/50 p-2 rounded">${req.note}</p>
            </div>
          ` : ''}

          <div class="pt-1 flex gap-2">
            <a href="index.html" class="flex-1 py-2 bg-emerald-600 text-neutral-950 font-bold rounded-lg text-center flex items-center justify-center gap-1">
              <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> Vytvořit Drop
            </a>
            <button onclick="deleteRequest(${idx})" class="px-3 py-2 bg-neutral-800 hover:bg-red-950 hover:text-red-400 text-neutral-400 rounded-lg">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function deleteRequest(idx) {
      if (confirm('Smazat tento požadavek?')) {
        const requests = JSON.parse(localStorage.getItem('my_requests') || '[]');
        requests.splice(idx, 1);
        localStorage.setItem('my_requests', JSON.stringify(requests));
        renderRequests();
      }
    }

    renderRequests();
  </script>
</body>
</html>
