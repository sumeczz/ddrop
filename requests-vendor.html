<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vendor — Správa Požadavků</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            brand: { DEFAULT: '#00b87c', light: '#00e699', dark: '#008f60' },
            bg: { light: '#f4f6f8', dark: '#0a0f14', cardLight: '#ffffff', cardDark: '#121921' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-bg-light dark:bg-bg-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between antialiased">

  <header class="px-5 py-4 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md bg-white/70 dark:bg-bg-dark/70 border-b border-slate-200/60 dark:border-slate-800/60">
    <a href="vendor.html" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-brand/10 dark:bg-brand/20 flex items-center justify-center text-brand dark:text-brand-light">
        <i data-lucide="shield-check" class="w-5 h-5"></i>
      </div>
      <span class="font-extrabold text-lg text-slate-900 dark:text-white">Vendor Portal</span>
    </a>

    <button onclick="document.documentElement.classList.toggle('dark')" class="p-2.5 rounded-full hover:bg-slate-200/60 dark:hover:bg-slate-800/60">
      <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
      <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
    </button>
  </header>

  <main class="flex-1 my-auto px-4 py-6 max-w-md mx-auto w-full space-y-4">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-black text-slate-900 dark:text-white flex items-center gap-2">
        <i data-lucide="inbox" class="w-5 h-5 text-brand"></i> Požadavky zákazníků
      </h1>
      <button onclick="renderRequests()" class="text-xs font-bold text-brand hover:underline flex items-center gap-1">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Obnovit
      </button>
    </div>

    <div id="requests-container" class="space-y-3"></div>
  </main>

  <script>
    lucide.createIcons();

    function renderRequests() {
      const container = document.getElementById('requests-container');
      container.innerHTML = '';
      
      const requests = JSON.parse(localStorage.getItem('my_requests') || '[]');

      if (requests.length === 0) {
        container.innerHTML = '<div class="p-8 text-center text-xs font-medium text-slate-400 bg-white dark:bg-bg-cardDark rounded-3xl border border-slate-200 dark:border-slate-800">Žádné příchozí požadavky.</div>';
        return;
      }

      requests.forEach((req, idx) => {
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-bg-cardDark border border-slate-200/80 dark:border-slate-800 rounded-3xl p-5 space-y-3 shadow-sm";
        
        card.innerHTML = `
          <div class="flex justify-between items-start border-b border-slate-100 dark:border-slate-800/80 pb-2">
            <div>
              <span class="font-mono font-bold text-brand dark:text-brand-light text-sm">${req.reqId}</span>
              <p class="text-[10px] text-slate-400">${new Date(req.date).toLocaleString('cs-CZ')}</p>
            </div>
            <span class="text-base font-black text-slate-900 dark:text-white font-mono">${req.amount} Kč</span>
          </div>

          <div class="space-y-1">
            <p class="text-[10px] font-extrabold uppercase text-slate-400">PaysafeCard Kupon</p>
            <p class="font-mono text-xs text-slate-800 dark:text-slate-200 bg-slate-50 dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 select-all">
              ${req.pscCode ? req.pscCode : '<span class="text-slate-400 italic">Nepřiložen</span>'}
            </p>
          </div>

          ${req.note ? `
            <div>
              <p class="text-[10px] font-extrabold uppercase text-slate-400">Poznámka / Oblast</p>
              <p class="text-xs text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-900/50 p-2.5 rounded-xl">${req.note}</p>
            </div>
          ` : ''}

          <div class="pt-2 flex gap-2">
            <button onclick="pairAndCreate('${req.reqId}')" class="flex-1 py-3 bg-brand hover:bg-brand-dark text-white font-extrabold rounded-2xl text-xs flex items-center justify-center gap-1">
              <i data-lucide="plus-circle" class="w-4 h-4"></i> Vytvořit Drop
            </button>
            <button onclick="deleteRequest(${idx})" class="p-3 bg-slate-100 dark:bg-slate-800 text-slate-500 rounded-2xl hover:text-red-500 transition">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function pairAndCreate(reqId) {
      sessionStorage.setItem('pair_req_id', reqId);
      window.location.href = 'vendor.html';
    }

    function deleteRequest(idx) {
      if (confirm('Smazat požadavek?')) {
        const requests = JSON.parse(localStorage.getItem('my_requests') || '[]');
        requests.splice(idx, 1);
        localStorage.setItem('my_requests', JSON.stringify(requests));
        renderRequests();
      }
    }

    renderRequests();
  </script>
</body>
</html>
