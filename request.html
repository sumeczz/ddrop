<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Požádat o nový drop — My Dead Drops</title>

  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            brand: { DEFAULT: '#00b87c', light: '#00e699', dark: '#008f60' },
            bg: { light: '#f4f6f8', dark: '#0a0f14', cardLight: '#ffffff', cardDark: '#121921' }
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s, color 0.3s; }
  </style>
</head>
<body class="bg-bg-light dark:bg-bg-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between antialiased">

  <!-- HEADER -->
  <header class="px-5 py-4 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md bg-white/70 dark:bg-bg-dark/70 border-b border-slate-200/60 dark:border-slate-800/60">
    <a href="index.html" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-brand/10 dark:bg-brand/20 flex items-center justify-center text-brand dark:text-brand-light">
        <i data-lucide="map-pin" class="w-5 h-5 fill-current"></i>
      </div>
      <span class="font-extrabold text-lg tracking-tight text-slate-900 dark:text-white">My Dead Drops</span>
    </a>

    <div class="flex items-center gap-2">
      <!-- Přepínač témat -->
      <button onclick="document.documentElement.classList.toggle('dark')" class="p-2.5 rounded-full hover:bg-slate-200/60 dark:hover:bg-slate-800/60 text-slate-600 dark:text-slate-300 transition">
        <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
        <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
      </button>
      <a href="index.html" class="p-2.5 rounded-full hover:bg-slate-200/60 dark:hover:bg-slate-800/60 text-slate-600 dark:text-slate-300">
        <i data-lucide="x" class="w-5 h-5"></i>
      </a>
    </div>
  </header>

  <!-- FORM CONTAINER -->
  <main class="flex-1 my-auto px-4 py-8 max-w-md mx-auto w-full space-y-6">
    <div class="space-y-1.5">
      <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">Požádat o nový drop</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400">Vyplň formulář a odešli žádost. Žádné osobní údaje nevyžadujeme.</p>
    </div>

    <form onsubmit="submitRequest(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Částka (Kč) *</label>
        <input type="number" id="req-amount" required placeholder="Např. 500" class="w-full bg-white dark:bg-bg-cardDark border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 text-sm font-medium focus:outline-none focus:border-brand text-slate-900 dark:text-white shadow-sm">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">PaysafeCard kód (volitelně)</label>
        <input type="text" id="req-psc" placeholder="Např. 1234-5678-9012-3456" class="w-full bg-white dark:bg-bg-cardDark border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 text-sm font-medium focus:outline-none focus:border-brand text-slate-900 dark:text-white shadow-sm">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Preferovaná lokalita</label>
        <input type="text" id="req-location" placeholder="Např. centrum, park, u mostu..." class="w-full bg-white dark:bg-bg-cardDark border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 text-sm font-medium focus:outline-none focus:border-brand text-slate-900 dark:text-white shadow-sm">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Poznámka</label>
        <textarea id="req-note" placeholder="Doplň další informace..." class="w-full bg-white dark:bg-bg-cardDark border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 text-sm font-medium focus:outline-none focus:border-brand h-24 resize-none text-slate-900 dark:text-white shadow-sm"></textarea>
      </div>

      <button type="submit" class="w-full py-4 bg-brand hover:bg-brand-dark text-white font-extrabold rounded-2xl shadow-lg shadow-brand/25 flex items-center justify-center gap-2 text-base active:scale-[0.98] transition">
        <i data-lucide="send" class="w-5 h-5"></i> Odeslat žádost
      </button>
    </form>

    <div class="text-center flex items-center justify-center gap-1.5 text-slate-400 dark:text-slate-500 text-xs">
      <i data-lucide="lock" class="w-3.5 h-3.5"></i> 100% anonymní. Bez registrace.
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="py-6 text-center space-y-1 text-slate-400 dark:text-slate-600 border-t border-slate-200/60 dark:border-slate-800/60">
    <div class="flex items-center justify-center gap-1.5 text-brand font-bold text-sm">
      <i data-lucide="map-pin" class="w-4 h-4 fill-current"></i> My Dead Drops
    </div>
    <p class="text-[10px] uppercase tracking-widest font-semibold">SKRYJ. SDÍLEJ. OBJEVUJ.</p>
  </footer>

  <script>
    lucide.createIcons();

    function submitRequest(e) {
      e.preventDefault();
      const amount = document.getElementById('req-amount').value;
      const pscCode = document.getElementById('req-psc').value.trim();
      const location = document.getElementById('req-location').value.trim();
      const noteInput = document.getElementById('req-note').value.trim();

      const combinedNote = [location ? `Lokalita: ${location}` : '', noteInput].filter(Boolean).join(' | ');
      const reqId = 'REQ-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      
      const requests = JSON.parse(localStorage.getItem('my_requests') || '[]');
      requests.push({
        reqId: reqId,
        amount: amount,
        pscCode: pscCode,
        note: combinedNote,
        date: new Date().toISOString()
      });
      
      localStorage.setItem('my_requests', JSON.stringify(requests));

      alert(`Žádost ${reqId} byla úspěšně odoslána!`);
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
